name: Reset ZAC.csv
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "伝票番号,送り先名,商品コード,受注数,商品名,ロケ,発送伝票番号,JAN" > ZAC.csv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ZAC.csv
          git diff --staged --quiet || git commit -m "ZAC.csv daily reset"
          git pull --rebase origin main
          git push
