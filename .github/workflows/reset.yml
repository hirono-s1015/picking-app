name: Reset ZAC.csv
on:
  schedule:
    - cron: '0 15 * * *'  # 毎日0時（日本時間）UTC15時
  workflow_dispatch:        # 手動実行も可能
jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "伝票番号,送り先名,商品コード,受注数,商品名,ロケ,発送伝票番号,JAN" > ZAC.csv
          echo "日時,担当者名,送り先,商品コード,発送伝票番号,結果" > logs/log.csv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ZAC.csv logs/log.csv
          git diff --staged --quiet || git commit -m "daily reset"
          git pull --rebase origin main
          git push
