name: CSV merge

on:
  push:
    paths:
      - 'AZU.csv'
      - 'ZAC1.csv'
      - 'ZAC2.csv'

jobs:
  merge-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python merge.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ZAC.csv
          git diff --staged --quiet || git commit -m "ZAC.csv auto update"
          git push
