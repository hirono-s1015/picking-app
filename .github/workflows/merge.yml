name: CSVデータ結合

on:
  push:
    paths:
      - 'AZU.csv'
      - 'ZAC1.csv'
      - 'ZAC2.csv'

jobs:
  merge-csv:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: CSVを結合
        run: python merge.py

      - name: ZAC.csvをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ZAC.csv
          git diff --staged --quiet || git commit -m "ZAC.csv自動更新"
          git push
